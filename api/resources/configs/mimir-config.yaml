common:
  storage:
    backend: filesystem
    filesystem:
      directory: /var/lib/mimir
  ring:
    kvstore:
      store: inmemory
limits:
  per_tenant:
    max_series_per_metric: 5000
    max_series_per_tenant: 10000
ingester:
  ring:
    replication_factor: 1
  lifecycler:
    ring:
      replication_factor: 1
compactor:
  data_dir: /var/lib/mimir/compactor
store_gateway:
  storage:
    backend: filesystem
    filesystem:
      directory: /var/lib/mimir/store
query_range:
  storage:
    backend: filesystem
    filesystem:
      directory: /var/lib/mimir/query
schema:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      hash: 1
analytics:
  reporting_enabled: false
