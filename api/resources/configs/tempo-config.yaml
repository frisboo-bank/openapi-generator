# Tempo — local dev stack (monolithic, filesystem storage)
#
# ⚠️  Local Tempo runs in monolithic mode with filesystem storage.
#     Prod runs distributed with S3/GCS. Trace routing, compaction,
#     and multi-tenant isolation are not replicated locally.
#
# OTLP ingestion is native in Tempo v0.32+. The otlphttp exporter
# sends to http://tempo:4318/otlp (see otel-collector-config.yaml).
server:
  http_listen_port: 3200
  grpc_listen_port: 9090

distributor:
  otlp:
    grpc:
      endpoint: 0.0.0.0:4317
    http:
      endpoint: 0.0.0.0:4318

compactor:
  compaction:
    compaction_window: 24h
    blocks_retention_period: 48h

ingester:
  lifecycler:
    ring:
      replication_factor: 1

storage:
  trace:
    backend: filesystem
    filesystem:
      path: /var/tempo/traces

overrides:
  defaults:
    tenants:
      mode: multi_tenant
    metrics_generator:
      enabled: false
