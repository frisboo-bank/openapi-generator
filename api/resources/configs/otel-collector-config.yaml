receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
      num_consumers: 2
      timeout: 5s
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: openapi-generator
  loki:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: "dev-tenant-1"
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
      num_consumers: 2
      timeout: 5s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679
  file_storage:
    directory: /var/lib/otelcol/file_storage
    timeout: 1s
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 1000
    timeout: 5s
  resource/environment:
    attributes:
      - key: deployment.environment
        value: "local-dev"
        action: upsert
        transform/redact-pii:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                - set(attributes["user.email"], "REDACTED_EMAIL")
                - set(attributes["user.phone"], "REDACTED_PHONE")
service:
  extensions: [health_check, pprof, zpages, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [loki]
