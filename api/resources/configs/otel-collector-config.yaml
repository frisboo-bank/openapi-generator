receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    headers:
      X-Scope-OrgID: "dev-tenant-1"
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
      num_consumers: 2
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: openapi-generator
  prometheusremotewrite/mimir:
    endpoint: http://mimir:8080/api/v1/push
    headers:
      X-Scope-OrgID: "dev-tenant-1"
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: "dev-tenant-1"
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
      num_consumers: 2
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679
  file_storage:
    directory: /var/lib/otelcol/file_storage
    timeout: 1s
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    send_batch_size: 1000
    timeout: 5s
  resource/environment:
    attributes:
      - key: deployment.environment
        value: "${env:APP_ENV}"
        action: upsert
  # PII redaction is enabled locally, same pattern as prod.
  transform/redact-pii:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["user.email"], "REDACTED_EMAIL")
          - set(attributes["user.phone"], "REDACTED_PHONE")
service:
  extensions: [health_check, pprof, zpages, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [prometheus, prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch, transform/redact-pii]
      exporters: [otlphttp/loki]
