# Prometheus scrape configuration
#
# Local scrape is static; prod uses ServiceMonitor/PodMonitor discovery.
# Labels are kept aligned intentionally so PromQL queries and alerting
# rules remain portable between local and prod environments.
scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          job: otel-collector
          cluster: local
          service_name: openapi-generator