name: openapi-generator
services:
  postgres:
    image: postgres:18-alpine
    container_name: openapi-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${postgres_user:-postgres}
      POSTGRES_PASSWORD: ${postgres_password:-postgres}
      POSTGRES_DB: ${postgres_db:-openapi_generator}
    ports:
      - "5432:5432"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "pg_isready -u ${postgres_user:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: openapi-generator-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2-alpine
    container_name: openapi-generator-nats
    restart: unless-stopped
    command: ["nats-server", "-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: openapi-generator-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./resources/configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - otelcol-file-storage:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
  jaeger:
    image: jaegertracing/jaeger
    container_name: openapi-generator-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
    networks:
      - frisboo-bank
  prometheus:
    image: prom/prometheus
    container_name: openapi-generator-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./resources/configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - frisboo-bank
  loki:
    image: grafana/loki
    container_name: openapi-generator-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./resources/configs/loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - frisboo-bank
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    profiles:
      - load-test
    networks:
      - frisboo-bank
  minio:
    image: minio/minio
    container_name: openapi-generator-minio
    restart: unless-stopped
    profiles:
      - storage-parity
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - frisboo-bank
  mimir:
    image: grafana/mimir
    container_name: openapi-generator-mimir
    restart: unless-stopped
    profiles:
      - metrics-parity
    command: ["-config.file=/etc/mimir/mimir-config.yaml", "-target=all"]
    ports:
      - "9009:9009"
    networks:
      - frisboo-bank
networks:
  frisboo-bank:
    name: frisboo-bank
volumes:
  otelcol-file-storage:
  minio-data: