name: openapi-generator
services:
  postgres:
    image: postgres:18-alpine
    container_name: openapi-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${postgres_user:-postgres}
      POSTGRES_PASSWORD: ${postgres_password:-postgres}
      POSTGRES_DB: ${postgres_db:-openapi_generator}
    ports:
      - "5432:5432"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "pg_isready -u ${postgres_user:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: openapi-generator-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2-alpine
    container_name: openapi-generator-nats
    restart: unless-stopped
    command: ["nats-server", "-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - frisboo-bank
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
  tempo:
    image: grafana/tempo
    container_name: openapi-generator-tempo
    restart: unless-stopped
    command: "-target=all -config.file=/etc/tempo.yaml"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
    volumes:
      - ./resources/configs/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      retries: 5
    networks:
      - frisboo-bank
  vulture:
    image: grafana/tempo-vulture
    container_name: openapi-generator-vulture
    restart: unless-stopped
    profiles:
      - trace-verification
    command: ["-prometheus-listen-address=:8080", "-tempo-query-url=http://tempo:3200", "-tempo-push-url=http://tempo:4317"]
    networks:
      - frisboo-bank
    depends_on:
      - tempo
  alloy:
    image: grafana/alloy
    container_name: openapi-generator-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      - ALLOY_OTLP_UPSTREAM=tempo:4317
    volumes:
      - ./resources/configs/config.alloy:/etc/alloy/config.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:12345/-/healthz"]
      interval: 10s
      retries: 5
    networks:
      - frisboo-bank
    depends_on:
      - tempo
  prometheus:
    image: prom/prometheus
    container_name: openapi-generator-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./resources/configs/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - frisboo-bank
  grafana:
    image: grafana/grafana
    container_name: openapi-generator-grafana
    restart: unless-stopped
    volumes:
      - ./resources/configs/grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./resources/configs/grafana/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./resources/configs/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
    ports:
      - "3000:3000"
    networks:
      - frisboo-bank
networks:
  frisboo-bank:
    name: frisboo-bank
volumes:
  tempo-data:
  loki-data:
