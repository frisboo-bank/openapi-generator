syntax = "proto3";

package entity.v1;

import "entity/v1/entity.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "query/v1/filter.proto";
import "query/v1/order.proto";
import "query/v1/pagination.proto";
import "query/v1/search.proto";

option go_package = "frisboo-bank/openapi-generator-service/internal/shared/grpc/gen/entity/v1;entityv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Entity Service"
    version: "1.0"
    description: "Manages entity resources."
  }
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "saml"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-SAML-Assertion"
      }
    }
  }
};

// ---------- List ----------
message ListEntitiesRequest {
  message Body {
    query.v1.PaginationRequest pagination = 1;
    query.v1.QueryFilters filters = 2;
    query.v1.QueryOrders orders = 3;
    query.v1.QuerySearches searches = 4;
  }
  Body body = 1;
}

message ListEntitiesResponse {
  message Data {
    repeated Entity entities = 1;
    query.v1.PaginationResponse pagination = 2;
  }
  Data data = 1;
}

// ---------- Get by Slug ----------
message GetEntityBySlugRequest {
  string slug = 1;
  optional bool include_hidden = 2;
}

message GetEntityBySlugResponse {
  message Data {
    Entity entity = 1;
  }
  Data data = 1;
}

// ---------- Create ----------
message CreateEntityRequest {
  message Payload {
    string slug = 1;
    string name = 2;
    optional string description = 3;
  }
  message Body {
    Payload payload = 1;
  }
  Body body = 1;
}

message CreateEntityResponse {
  message Data {
    Entity entity = 1;
  }
  Data data = 1;
}

// ---------- Update ----------
message UpdateEntityRequest {
  message Payload {
    optional string name = 1;
    optional string description = 2;
  }
  message Body {
    Payload payload = 1;
    google.protobuf.FieldMask update_mask = 2;
  }
  string slug = 1;
  int64 version_lock = 2;
  Body body = 3;
}

message UpdateEntityResponse {
  message Data {
    Entity entity = 1;
  }
  Data data = 1;
}

// ---------- Delete ----------
message DeleteEntityRequest {
  string slug = 1;
  int64 version_lock = 2;
}

message DeleteEntityResponse {
  message Data {
    Entity entity = 1;
    google.protobuf.Timestamp deleted_at = 2;
    bool was_permanent = 3;
  }
  Data data = 1;
}

// ---------- Service ----------
service EntityService {
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse) {
    option (google.api.http) = {
      post: "/entities"
      body: "body"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List and search entities"
      operation_id: "listEntities"
      tags: "Entities"
      security: {
        security_requirement: {key: "saml"}
      }
    };
  }

  rpc GetEntityBySlug(GetEntityBySlugRequest) returns (GetEntityBySlugResponse) {
    option (google.api.http) = {get: "/entity/{slug}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get entity by slug"
      operation_id: "getEntityBySlug"
      tags: "Entities"
      security: {
        security_requirement: {key: "saml"}
      }
    };
  }

  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse) {
    option (google.api.http) = {
      post: "/entity"
      body: "body"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a new entity"
      operation_id: "createEntity"
      tags: "Entities"
      security: {
        security_requirement: {key: "saml"}
      }
    };
  }

  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse) {
    option (google.api.http) = {
      patch: "/entity/{slug}"
      body: "body"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update an entity"
      operation_id: "updateEntity"
      tags: "Entities"
      security: {
        security_requirement: {key: "saml"}
      }
    };
  }

  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse) {
    option (google.api.http) = {delete: "/entity/{slug}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete an entity"
      operation_id: "deleteEntity"
      tags: "Entities"
      security: {
        security_requirement: {key: "saml"}
      }
    };
  }
}
